name: Build SentinelX.exe (Windows)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build C++ core (MinGW)
        run: g++ -O3 -std=c++17 -shared -static -static-libgcc -static-libstdc++ core/engine.cpp -o core/sentinelx_core.dll
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Package
        run: python -m PyInstaller --clean -y sentinelx.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelX-windows-exe
          path: dist/SentinelX.exe
